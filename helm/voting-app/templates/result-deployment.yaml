apiVersion: apps/v1
kind: Deployment

metadata:
  name: result
  labels:
    app: result

spec:
  replicas: {{ .Values.result.replicaCount }}

  strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

  selector:
    matchLabels:
      app: result

  template:
    metadata:
      labels:
        app: result

    spec:
      containers:
        - name: result
          image: {{ .Values.result.image.repository }}:{{ .Values.result.image.tag }}
          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              cpu: {{ .Values.result.resources.requests.cpu }}
              memory: {{ .Values.result.resources.requests.memory }}
            limits:
              cpu: {{ .Values.result.resources.limits.cpu }}
              memory: {{ .Values.result.resources.limits.memory }}
