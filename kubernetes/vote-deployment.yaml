apiVersion: apps/v1
kind: Deployment

metadata:
  name: vote

spec:
  replicas: 2

  selector:
    matchLabels:
      app: vote

  template:
    metadata:
      labels:
        app: vote

    spec:
      containers:
        - name: vote
          image: 687633314339.dkr.ecr.ap-south-1.amazonaws.com/devops-voting/vote:1.0.0

          ports:
            - containerPort: 80